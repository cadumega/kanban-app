# fly.toml app configuration file generated for kanban-api-cadu on 2026-01-19T15:09:26-03:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'kanban-api-cadu'
primary_region = 'gru'

[build]

[env]
  DATA_DIR = '/data'
  NODE_ENV = 'production'

[[mounts]]
  source = 'kanban_data'
  destination = '/data'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
